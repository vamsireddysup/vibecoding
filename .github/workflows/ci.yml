name: ci

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install RTL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Install cocotb
        run: pip install cocotb

      - name: Report tool versions
        run: |
          iverilog -V | head -1
          verilator --version
          python -c "import cocotb; print('cocotb', cocotb.__version__)"

      - name: Lint
        run: make lint

      - name: Regression
        run: make regress

      - name: Check the suite can still fail
        # A green suite proves nothing unless it goes red on a broken design.
        # This injects the classic off-by-one into the FIFO's full condition and
        # requires the regression to fail. If it passes here, the tests are
        # decorative and the build should break.
        run: |
          sed -i 's|assign full  = (wr_ptr\[ADDR_W\] != rd_ptr\[ADDR_W\]) \&\&|assign full  = (count == DEPTH - 1); //|' \
            exercises/01-sync-fifo/rtl/sync_fifo.v
          sed -i 's|^                   (wr_ptr\[ADDR_W-1:0\] == rd_ptr\[ADDR_W-1:0\]);||' \
            exercises/01-sync-fifo/rtl/sync_fifo.v
          if make regress; then
            echo "FAIL: the testbench passed against a knowingly broken design"
            exit 1
          else
            echo "OK: the testbench caught the injected bug"
          fi
          git checkout exercises/01-sync-fifo/rtl/sync_fifo.v
